name: Deploy Proxy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'proxy_golang/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy_golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy_golang/go.mod
          cache-dependency-path: proxy_golang/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run lint
        run: golangci-lint run ./...

      - name: Run unit tests
        run: go test ./... -v -count=1 -short

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        working-directory: proxy_golang
        run: npx vercel --token="$VERCEL_TOKEN" --prod --yes --env PROXY_SECRET="$PROXY_SECRET"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
