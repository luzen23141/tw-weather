name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Expo cache
        uses: actions/cache@v4
        with:
          path: .expo
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Export Expo Web (static)
        run: |
          npx expo export -c --platform web &
          EXPO_PID=$!
          # 等待 bundle 產生或 process 結束
          for i in $(seq 1 120); do
            sleep 5
            if ls dist/_expo/static/js/web/*.js >/dev/null 2>&1; then
              echo "✅ Bundle ready"
              kill "$EXPO_PID" 2>/dev/null || true
              wait "$EXPO_PID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              wait "$EXPO_PID"; EC=$?
              [ "$EC" -ne 0 ] && echo "❌ expo export failed (exit $EC)" && exit "$EC"
              exit 0
            fi
          done
          echo "❌ expo export timed out (10 min)"
          kill -9 "$EXPO_PID" 2>/dev/null || true
          exit 1
        timeout-minutes: 12
        env:
          EXPO_PUBLIC_PROXY_URL: https://weatherb.agubear.black
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BASE_URL: /
          CI: 'true'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tw-weather --commit-message="${{ github.sha }}"

  purge-cdn:
    name: Purge Cloudflare Cache
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Debug Check
        run: |
          echo "Zone ID 長度: ${#ZONE_ID}"
          echo "Token 長度: ${#TOKEN}"
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Purge Cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
