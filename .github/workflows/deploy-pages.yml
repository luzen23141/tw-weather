name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-expo: 'true'

      - name: Export Expo Web (static)
        run: |
          set -euo pipefail
          npx expo export -c --platform web > expo-export.log 2>&1 &
          EXPO_PID=$!

          for i in $(seq 1 180); do
            if grep -q 'Exported: dist' expo-export.log; then
              test -f dist/index.html
              ls dist/_expo/static/js/web/entry-*.js >/dev/null 2>&1
              grep -q '/_expo/static/js/web/entry-' dist/index.html
              kill "$EXPO_PID" 2>/dev/null || true
              wait "$EXPO_PID" 2>/dev/null || true
              cat expo-export.log
              exit 0
            fi

            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              wait "$EXPO_PID"
              cat expo-export.log
              test -f dist/index.html
              ls dist/_expo/static/js/web/entry-*.js >/dev/null 2>&1
              grep -q '/_expo/static/js/web/entry-' dist/index.html
              exit 0
            fi

            sleep 5
          done

          cat expo-export.log
          echo '❌ expo export timed out before dist was finalized'
          kill "$EXPO_PID" 2>/dev/null || true
          wait "$EXPO_PID" 2>/dev/null || true
          exit 1
        timeout-minutes: 12
        env:
          EXPO_PUBLIC_PROXY_URL: https://weatherb.agubear.black
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BASE_URL: /
          CI: 'true'

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=tw-weather --commit-message="${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  purge-cdn:
    name: Purge Cloudflare Cache
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Zone ID
        id: zone
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['CF_API_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          zone_id = None

          for zone_name in ('weather.agubear.black', 'agubear.black'):
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/zones?name={zone_name}',
                  headers=headers,
              )

              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)

              if payload.get('success') and payload.get('result'):
                  zone_id = payload['result'][0]['id']
                  break

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'zone_id={zone_id or ""}\n')

          if zone_id:
              print(f'Resolved Cloudflare zone: {zone_id}')
          else:
              print('Unable to resolve Cloudflare zone; skipping cache purge')
          PY

      - name: Purge Custom Domain Cache
        if: steps.zone.outputs.zone_id != ''
        env:
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

  verify-custom-domain:
    name: Verify Custom Domain
    needs: [purge-cdn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify deployment propagation
        run: node scripts/verify-deploy.mjs
