name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Expo cache
        uses: actions/cache@v4
        with:
          path: .expo
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Export Expo Web (static)
        run: |
          set -euo pipefail
          npx expo export -c --platform web > expo-export.log 2>&1 &
          EXPO_PID=$!

          for i in $(seq 1 180); do
            if grep -q 'Exported: dist' expo-export.log; then
              test -f dist/index.html
              ls dist/_expo/static/js/web/entry-*.js >/dev/null 2>&1
              grep -q '/_expo/static/js/web/entry-' dist/index.html
              kill "$EXPO_PID" 2>/dev/null || true
              wait "$EXPO_PID" 2>/dev/null || true
              cat expo-export.log
              exit 0
            fi

            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              wait "$EXPO_PID"
              cat expo-export.log
              test -f dist/index.html
              ls dist/_expo/static/js/web/entry-*.js >/dev/null 2>&1
              grep -q '/_expo/static/js/web/entry-' dist/index.html
              exit 0
            fi

            sleep 5
          done

          cat expo-export.log
          echo '❌ expo export timed out before dist was finalized'
          kill "$EXPO_PID" 2>/dev/null || true
          wait "$EXPO_PID" 2>/dev/null || true
          exit 1
        timeout-minutes: 12
        env:
          EXPO_PUBLIC_PROXY_URL: https://weatherb.agubear.black
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BASE_URL: /
          CI: 'true'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tw-weather --commit-message="${{ github.sha }}"

  purge-cdn:
    name: Purge Cloudflare Cache
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Zone ID
        id: zone
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          account_id = os.environ['CF_ACCOUNT_ID']
          token = os.environ['CF_API_TOKEN']
          req = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/zones?name=agubear.black&account.id={account_id}',
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
          )

          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          if not payload.get('success') or not payload.get('result'):
              raise SystemExit(f"Unable to resolve Cloudflare zone: {payload}")

          zone_id = payload['result'][0]['id']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'zone_id={zone_id}\n')
          PY

      - name: Purge Custom Domain Cache
        env:
          CF_ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

  verify-custom-domain:
    name: Verify Custom Domain
    needs: [purge-cdn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Verify deployment propagation
        run: node scripts/verify-deploy.mjs
