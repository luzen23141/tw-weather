name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm

      - name: Expo cache
        uses: actions/cache@v4
        with:
          path: .expo
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Export Expo Web (static)
        run: |
          npx expo export --platform web &
          EXPO_PID=$!
          for i in $(seq 1 120); do
            sleep 5
            if ls dist/_expo/static/js/web/*.js >/dev/null 2>&1; then
              echo "Bundle ready, stopping Metro"
              kill "$EXPO_PID" 2>/dev/null || true
              wait "$EXPO_PID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              wait "$EXPO_PID"; EC=$?
              [ "$EC" -ne 0 ] && echo "expo export failed (exit $EC)" && exit "$EC"
              exit 0
            fi
          done
          echo "expo export timed out (10 min)"
          kill -9 "$EXPO_PID" 2>/dev/null || true
          exit 1
        env:
          EXPO_PUBLIC_PROXY_URL: https://weatherb.agubear.black
          BASE_URL: /
          CI: "true"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tw-weather
