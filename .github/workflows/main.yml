name: Main CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 第 1 層：靜態檢查（並行，快速失敗）
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Type Check
        run: pnpm type-check

  format-and-unused:
    name: Format & Unused Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Prettier
        run: pnpm format:check
      - name: Run Unused Check
        run: pnpm check:unused

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit dependencies for vulnerabilities
        run: pnpm audit --production

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for hardcoded secrets using trufflehog
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d
        with:
          path: ./
          extra_args: --debug
      - name: Check for .env files in git history
        run: |
          echo "檢查 .env 文件..."
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '\.env$|\.env\.[^e]' | grep -v '\.example$'; then
            echo "❌ 嚴重：.env 文件被提交！"
            exit 1
          fi
          if [ -f ".env" ]; then
            echo "注意：.env 文件存在於工作目錄（不被追蹤是正確的）"
          fi
          echo ".env 文件檢查通過"

  # 第 2 層：測試＋構建（依賴第 1 層全部通過才跑，有錯就停止）
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, format-and-unused]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      - name: Prepare Jest results directory
        run: mkdir -p test-results/jest

      - name: Run unit tests with coverage + JSON output
        run: pnpm test:unit:ci

      - name: Show slow Jest tests (top 10)
        if: always()
        run: pnpm ci:slow-tests -- --scope jest --top 10

      - name: Archiving Jest machine-readable results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jest-results
          path: test-results/jest/results.json
          retention-days: 7

      - name: Archiving unit coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-unit
          path: coverage/
          retention-days: 7

  integration-tests:
    name: Jest Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, format-and-unused]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      - name: Run integration tests with coverage
        run: pnpm test:integration:ci

      - name: Archiving integration coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-integration
          path: coverage/
          retention-days: 7

  build-web:
    name: Build Expo Web
    runs-on: ubuntu-latest
    needs: [lint, type-check, format-and-unused]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-expo: 'true'

      - name: Export Web build
        run: bash scripts/expo-export.sh
        env:
          EXPO_PUBLIC_PROXY_URL: https://weatherb.agubear.black
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          BASE_URL: /
          CI: true

      - name: Scan bundle for problematic ESM patterns
        run: pnpm check:bundle

  # 第 3 層：E2E 測試（依賴測試＋構建通過才跑）
  e2e-web:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build-web]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      # 快取 Playwright 瀏覽器（key 綁定 pnpm-lock.yaml，版本升級自動失效）
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e:web
        env:
          EXPO_PUBLIC_PROXY_URL: ${{ vars.PROXY_URL }}
          EXPO_PUBLIC_PROXY_SECRET: ${{ secrets.PROXY_SECRET }}

      - name: Show slow Playwright tests + KPI gates
        if: always()
        run: pnpm ci:slow-tests -- --scope e2e --top 10
        env:
          CI_E2E_MIN_TESTS: '1'

      - name: Upload Playwright machine-readable results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/playwright/results.json
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 最終狀態彙總
  check-suite:
    name: All Checks Passed ✅
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        type-check,
        format-and-unused,
        dependency-audit,
        secrets-scan,
        unit-tests,
        integration-tests,
        build-web,
        e2e-web,
      ]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.type-check.result }}" != "success" ] || [ "${{ needs.format-and-unused.result }}" != "success" ]; then
            echo "❌ Static checks failed"
            exit 1
          fi
          if [ "${{ needs.dependency-audit.result }}" != "success" ] || [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "❌ Security checks failed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi
          if [ "${{ needs.build-web.result }}" != "success" ]; then
            echo "❌ Web build failed"
            exit 1
          fi
          if [ "${{ needs.e2e-web.result }}" != "success" ]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          echo "✅ All CI checks passed! Ready to merge."
